<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Agustín Servicios Generales — Málaga · Costa del Sol · Algarve</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ─────────────────── TOKENS ─────────────────── */
:root{
  --y:#F5C518;--yl:#FFD84D;--yd:rgba(245,197,24,.14);--yb:rgba(245,197,24,.3);
  --bk:#060606;--ink:#0B0B0B;--s1:#111;--s2:#181818;--s3:#1F1F1F;
  --br:rgba(255,255,255,.06);--br2:rgba(255,255,255,.1);
  --tx:rgba(255,255,255,.9);--mu:rgba(255,255,255,.42);--fa:rgba(255,255,255,.08);
  --wh:#fff;
  --r:8px;--r2:14px;--r3:20px;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;font-size:16px;}
body{font-family:'Inter',sans-serif;background:var(--bk);color:var(--tx);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
img{display:block;max-width:100%;}
button{font-family:'Inter',sans-serif;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--y);border-radius:2px;}

/* ─────────────────── CURSOR ─────────────────── */
.cur{position:fixed;pointer-events:none;z-index:9999;mix-blend-mode:difference;}
.cur-dot{width:8px;height:8px;background:var(--wh);border-radius:50%;transform:translate(-50%,-50%);}
.cur-ring{width:36px;height:36px;border:1.5px solid rgba(255,255,255,.45);border-radius:50%;transform:translate(-50%,-50%);transition:width .3s var(--ease),height .3s var(--ease),opacity .2s;}
body:has(a:hover) .cur-ring,body:has(button:hover) .cur-ring{width:52px;height:52px;opacity:.7;}

/* ─────────────────── REVEAL ─────────────────── */
.reveal{opacity:0;transform:translateY(32px);transition:opacity .8s var(--ease),transform .8s var(--ease);}
.reveal.in{opacity:1;transform:none;}
.reveal-l{opacity:0;transform:translateX(-28px);transition:opacity .7s var(--ease),transform .7s var(--ease);}
.reveal-l.in{opacity:1;transform:none;}
.reveal-r{opacity:0;transform:translateX(28px);transition:opacity .7s var(--ease),transform .7s var(--ease);}
.reveal-r.in{opacity:1;transform:none;}
.d1{transition-delay:.1s!important;}
.d2{transition-delay:.2s!important;}
.d3{transition-delay:.3s!important;}
.d4{transition-delay:.4s!important;}
.d5{transition-delay:.5s!important;}

/* ─────────────────── NAV ─────────────────── */
nav{
  position:fixed;inset:0 0 auto;z-index:500;
  height:68px;display:flex;align-items:center;justify-content:space-between;
  padding:0 5.5%;
  background:rgba(6,6,6,0);
  transition:background .4s,border-color .4s,backdrop-filter .4s;
  border-bottom:1px solid transparent;
}
nav.scr{background:rgba(6,6,6,.96);border-color:var(--br);backdrop-filter:blur(20px);}
.nlogo{display:flex;align-items:center;gap:12px;cursor:pointer;}
.nmark{
  width:36px;height:36px;background:var(--y);border-radius:7px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  position:relative;overflow:hidden;
}
.nmark::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.25),transparent);}
.nmark svg{width:18px;height:18px;position:relative;z-index:1;}
.nname{font-family:'Oswald',sans-serif;font-size:17px;font-weight:600;letter-spacing:1px;text-transform:uppercase;line-height:1.1;}
.ntag{font-size:8.5px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--y);margin-top:1px;}
.nlinks{display:flex;gap:32px;list-style:none;}
.nlinks a{font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--mu);transition:color .2s;position:relative;}
.nlinks a::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1px;background:var(--y);transition:width .2s;}
.nlinks a:hover{color:var(--wh);}
.nlinks a:hover::after{width:100%;}
.nright{display:flex;align-items:center;gap:9px;}
.lsw{display:flex;background:var(--s2);border:1px solid var(--br);border-radius:20px;padding:3px;gap:2px;}
.lb{border:none;background:none;color:var(--mu);font-size:10.5px;font-weight:700;letter-spacing:1px;padding:5px 10px;border-radius:14px;cursor:pointer;transition:all .18s;}
.lb.on{background:var(--y);color:var(--bk);}
.ncta{
  background:var(--y);color:var(--bk);border:none;
  padding:10px 20px;border-radius:6px;
  font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;
  cursor:pointer;transition:all .2s;
}
.ncta:hover{background:var(--yl);box-shadow:0 0 20px rgba(245,197,24,.35);}
.hbg{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:8px;margin-right:-8px;}
.hbg span{display:block;width:22px;height:2px;background:var(--wh);transition:all .3s;border-radius:1px;}

/* ─────────────────── MOBILE MENU ─────────────────── */
.mmenu{position:fixed;inset:0;background:var(--ink);z-index:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;opacity:0;pointer-events:none;transition:opacity .28s;}
.mmenu.on{opacity:1;pointer-events:all;}
.mlink{font-family:'Oswald',sans-serif;font-size:38px;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--mu);padding:14px 0;border-bottom:1px solid var(--br);width:68%;text-align:center;transition:color .2s;}
.mlink:hover{color:var(--y);}
.mclose{position:absolute;top:18px;right:20px;background:none;border:none;color:var(--mu);font-size:24px;cursor:pointer;width:36px;height:36px;}

/* ─────────────────── HERO ─────────────────── */
#hero{
  min-height:100vh;display:grid;place-items:center;
  padding:100px 5.5% 80px;
  position:relative;overflow:hidden;
  background:var(--bk);
}
.hero-bg-img{
  position:absolute;inset:0;
  background-image:url('https://images.unsplash.com/photo-1567427017947-545c5f8d16ad?w=1400&q=60');
  background-size:cover;background-position:center;
  opacity:.06;
  pointer-events:none;
}
.hero-orb{
  position:absolute;top:-10%;left:-5%;
  width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,197,24,.07) 0%,transparent 70%);
  pointer-events:none;animation:orb 8s ease-in-out infinite alternate;
}
.hero-orb2{
  position:absolute;bottom:-20%;right:-10%;
  width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,197,24,.04) 0%,transparent 70%);
  pointer-events:none;animation:orb 10s ease-in-out infinite alternate-reverse;
}
@keyframes orb{0%{transform:translate(0,0)scale(1);}100%{transform:translate(40px,30px)scale(1.1);}}
.hero-lines{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(245,197,24,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(245,197,24,.025) 1px,transparent 1px);
  background-size:80px 80px;
  pointer-events:none;
}
.hero-inner{
  position:relative;z-index:2;
  display:grid;grid-template-columns:1fr 1fr;
  gap:0;align-items:center;width:100%;max-width:1300px;
}
.hero-left{padding-right:6%;}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:10px;
  font-size:10.5px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
  color:var(--y);margin-bottom:28px;
}
.hero-eyebrow::before{content:'';width:24px;height:1px;background:var(--y);}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--y);animation:pulse 2s ease infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.7);}}
h1.hh{
  font-family:'Oswald',sans-serif;
  font-size:clamp(48px,7vw,96px);
  font-weight:700;line-height:.95;
  letter-spacing:-1px;
  text-transform:uppercase;
  margin-bottom:28px;
}
h1.hh .acc{color:var(--y);display:block;}
h1.hh .lt{font-weight:400;color:rgba(255,255,255,.5);}
.hero-body{font-size:16px;line-height:1.8;color:var(--mu);max-width:440px;margin-bottom:40px;}
.hacts{display:flex;gap:11px;flex-wrap:wrap;}
.btn-y{
  background:var(--y);color:var(--bk);border:none;
  padding:13px 26px;border-radius:var(--r);
  font-family:'Inter',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;
  cursor:pointer;transition:all .25s;display:inline-flex;align-items:center;gap:8px;
}
.btn-y:hover{background:var(--yl);box-shadow:0 6px 22px rgba(245,197,24,.3);transform:translateY(-1px);}
.btn-out{
  background:transparent;color:var(--tx);
  border:1px solid var(--br2);
  padding:13px 24px;border-radius:var(--r);
  font-family:'Inter',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;
  cursor:pointer;transition:all .25s;
}
.btn-out:hover{border-color:var(--y);color:var(--y);}
.hero-stats{
  display:flex;gap:0;margin-top:56px;
  border-top:1px solid var(--br);padding-top:36px;
}
.hst{padding:0 32px 0 0;border-right:1px solid var(--br);}
.hst:first-child{padding-left:0;}
.hst:last-child{border-right:none;}
.hstn{font-family:'Oswald',sans-serif;font-size:42px;font-weight:700;color:var(--y);line-height:1;letter-spacing:.5px;}
.hstl{font-size:10.5px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin-top:5px;}

/* HERO RIGHT — service pills */
.hero-right{
  display:flex;flex-direction:column;gap:10px;
  padding-left:2%;
}
.hpill{
  display:flex;align-items:center;gap:14px;
  background:var(--s1);border:1px solid var(--br);border-radius:12px;
  padding:16px 20px;
  transition:all .3s var(--ease);
  cursor:default;
  position:relative;overflow:hidden;
}
.hpill::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--y);transform:scaleY(0);transform-origin:bottom;transition:transform .3s var(--ease);}
.hpill:hover{border-color:var(--yb);transform:translateX(4px);}
.hpill:hover::before{transform:scaleY(1);}
.hpill-ico{font-size:20px;flex-shrink:0;width:36px;text-align:center;}
.hpill-t{font-size:15px;font-weight:700;letter-spacing:.1px;}
.hpill-s{font-size:12.5px;color:var(--mu);margin-top:1px;}

/* ─────────────────── TICKER ─────────────────── */
.ticker{background:var(--y);overflow:hidden;height:46px;display:flex;align-items:center;}
.ticker-track{display:flex;align-items:center;gap:0;animation:tick 22s linear infinite;white-space:nowrap;}
.ticker-track:hover{animation-play-state:paused;}
@keyframes tick{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
.tick-item{display:inline-flex;align-items:center;gap:10px;padding:0 28px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--bk);flex-shrink:0;}
.tick-sep{width:4px;height:4px;border-radius:50%;background:rgba(0,0,0,.25);flex-shrink:0;}

/* ─────────────────── SECTIONS COMMON ─────────────────── */
section{padding:110px 5.5%;}
.s-tag{display:inline-flex;align-items:center;gap:9px;font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--y);margin-bottom:14px;}
.s-tag::before{content:'';width:22px;height:1px;background:var(--y);}
.s-tit{font-family:'Oswald',sans-serif;font-size:clamp(32px,3.8vw,52px);font-weight:700;text-transform:uppercase;letter-spacing:.5px;line-height:1.05;margin-bottom:16px;}
.s-body{font-size:15px;line-height:1.85;color:var(--mu);max-width:480px;}

/* ─────────────────── SERVICES ─────────────────── */
#services{background:var(--ink);}
.svc-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:56px;gap:40px;flex-wrap:wrap;}
.svc-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  background:var(--br);border:1px solid var(--br);border-radius:var(--r3);overflow:hidden;
}
.svc{
  background:var(--ink);padding:32px 28px;
  display:flex;flex-direction:column;gap:12px;
  transition:background .25s;position:relative;cursor:default;
}
.svc:hover{background:var(--s1);}
.svc-n{font-size:11px;font-weight:600;letter-spacing:2px;color:var(--y);opacity:.5;}
.svc-ico{font-size:26px;}
.svc-t{font-size:16px;font-weight:700;}
.svc-d{font-size:14px;color:var(--mu);line-height:1.75;}
.svc-arr{position:absolute;top:26px;right:26px;color:var(--yb);font-size:16px;transition:all .25s;}
.svc:hover .svc-arr{color:var(--y);transform:translate(2px,-2px);}

/* ─────────────────── ABOUT ─────────────────── */
#about{background:var(--bk);}
.abt-grid{display:grid;grid-template-columns:1fr 1fr;gap:90px;align-items:center;}
.abt-vis{position:relative;}
.abt-card{background:var(--s1);border:1px solid var(--br);border-radius:var(--r3);padding:40px 36px;}
.abt-logo{font-family:'Oswald',sans-serif;font-size:72px;font-weight:700;color:var(--y);line-height:1;letter-spacing:2px;text-transform:uppercase;}
.abt-sub{font-size:9.5px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--mu);margin-top:5px;margin-bottom:28px;}
.abt-div{height:1px;background:var(--br);margin-bottom:24px;}
.abt-rows{display:flex;flex-direction:column;gap:16px;}
.abt-row{display:flex;align-items:flex-start;gap:12px;}
.abt-ico{width:34px;height:34px;border-radius:7px;background:var(--yd);border:1px solid var(--yb);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:1px;}
.abt-lbl{font-size:9.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mu);}
.abt-val{font-size:13px;font-weight:600;margin-top:2px;line-height:1.5;}
.abt-badge{
  position:absolute;bottom:-16px;right:-16px;
  background:var(--y);border-radius:var(--r2);padding:14px 20px;text-align:center;
  box-shadow:0 8px 30px rgba(245,197,24,.3);
}
.abt-bn{font-family:'Oswald',sans-serif;font-size:38px;font-weight:700;color:var(--bk);line-height:1;letter-spacing:.5px;}
.abt-bl{font-size:8.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(0,0,0,.5);}
.chk-list{list-style:none;display:flex;flex-direction:column;gap:11px;margin:26px 0 32px;}
.chk-list li{display:flex;align-items:flex-start;gap:10px;font-size:15px;color:var(--tx);line-height:1.65;}
.chk{width:19px;height:19px;background:var(--yd);border:1px solid var(--yb);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--y);margin-top:3px;}
.ph-row{display:flex;flex-direction:column;gap:8px;}
.ph-chip{display:flex;align-items:center;gap:11px;background:var(--s1);border:1px solid var(--br);border-radius:var(--r);padding:13px 15px;transition:border-color .2s;font-size:14px;font-weight:600;}
.ph-chip:hover{border-color:var(--yb);}
.ph-fl{font-size:17px;}
.ph-lbl{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--mu);display:block;}

/* ─────────────────── GALLERY ─────────────────── */
#gallery{background:var(--ink);}
.gal-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:44px;gap:30px;flex-wrap:wrap;}
.gal-right{display:flex;flex-direction:column;align-items:flex-end;gap:9px;}
.adm-btn{display:inline-flex;align-items:center;gap:7px;background:var(--s2);border:1px solid var(--br);border-radius:var(--r);padding:9px 14px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mu);cursor:pointer;transition:all .2s;}
.adm-btn:hover{border-color:var(--yb);color:var(--y);}
.adm-bar{background:var(--yd);border:1px solid var(--yb);border-radius:var(--r);padding:9px 13px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:11.5px;}
.adm-bt{color:var(--y);font-weight:700;}
.adm-bl{background:none;border:none;font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mu);cursor:pointer;transition:color .2s;}
.adm-bl:hover{color:var(--y);}

/* masonry-ish grid */
.gal-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-auto-rows:200px;
  gap:10px;
}
.gal-grid .gc:nth-child(5n+1){grid-column:span 2;grid-row:span 2;}
.gal-grid .gc:nth-child(5n+4){grid-row:span 2;}
.gc{border-radius:var(--r2);overflow:hidden;position:relative;background:var(--s2);cursor:pointer;}
.gc img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease);}
.gc:hover img{transform:scale(1.07);}
.gc-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9) 0%,rgba(0,0,0,.1) 50%,transparent 100%);opacity:0;transition:opacity .3s;display:flex;align-items:flex-end;padding:16px;}
.gc:hover .gc-ov{opacity:1;}
.gc-t{font-size:13px;font-weight:700;flex:1;}
.gc-d{font-size:11px;color:rgba(255,255,255,.55);margin-top:2px;}
.gc-del{background:rgba(160,30,30,.92);border:none;color:#fff;font-size:9.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:5px 8px;border-radius:5px;cursor:pointer;margin-left:8px;flex-shrink:0;}
.gal-empty{grid-column:1/-1;padding:64px 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;}
.gal-empty-ico{font-size:38px;opacity:.15;}
.gal-empty-t{font-size:13.5px;color:var(--mu);max-width:280px;line-height:1.8;white-space:pre-line;}

/* ─────────────────── INSTAGRAM ─────────────────── */
#instagram{background:var(--bk);padding:110px 5.5%;}
.ig-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:40px;flex-wrap:wrap;gap:20px;}
.ig-follow{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:#fff;border:none;padding:11px 20px;border-radius:var(--r);font-weight:700;font-size:12px;letter-spacing:.5px;cursor:pointer;transition:all .25s;}
.ig-follow:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(220,39,67,.35);}
.ig-strip{
  display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;
  scrollbar-width:none;
}
.ig-strip::-webkit-scrollbar{display:none;}
.ig-post{
  flex-shrink:0;width:200px;height:200px;border-radius:var(--r2);
  overflow:hidden;position:relative;cursor:pointer;
  background:var(--s2);
}
.ig-post img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease);}
.ig-post:hover img{transform:scale(1.08);}
.ig-post-ov{
  position:absolute;inset:0;
  background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .25s;
  font-size:22px;
}
.ig-post:hover .ig-post-ov{opacity:1;}
.ig-placeholder{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;color:var(--mu);font-size:12px;
}
.ig-ph-ico{font-size:28px;opacity:.3;}
.ig-cta-row{margin-top:28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.ig-cta-lbl{font-size:13px;color:var(--mu);}
.ig-handle{font-size:13.5px;font-weight:700;color:var(--y);}

/* ─────────────────── CONTACT ─────────────────── */
#contact{background:var(--ink);}
.con-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:start;}
.con-methods{display:flex;flex-direction:column;gap:9px;margin-top:30px;}
.con-m{display:flex;align-items:center;gap:13px;background:var(--s1);border:1px solid var(--br);border-radius:var(--r);padding:15px 17px;transition:all .2s;}
.con-m:hover{border-color:var(--yb);transform:translateX(3px);}
.con-m-ico{width:36px;height:36px;border-radius:7px;background:var(--yd);border:1px solid var(--yb);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.con-m-lbl{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--mu);}
.con-m-val{font-size:14.5px;font-weight:700;margin-top:2px;}

}

/* ══ REVEAL HOOK ══ */
function useReveal(){
  React.useEffect(()=>{
    const els=document.querySelectorAll('.reveal,.reveal-l,.reveal-r');
    const io=new IntersectionObserver(entries=>{
      entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in');});
    },{threshold:0.12});
    els.forEach(el=>io.observe(el));
    return()=>io.disconnect();
  },[]);
}

          <li><a href="tel:+34667774648">🇪🇸 +34 667 77 46 48</a></li>
          <li><a href="tel:+351927418705">🇵🇹 +351 927 418 705</a></li>
          <li><a href="#">Málaga · Costa del Sol</a></li>
          <li><a href="#">Algarve, Portugal</a></li>
        </ul>
      </div>
      <div>
        <div className="ft-ct">Social</div>
        <ul className="ft-lks">
          <li><a href={IG_URL} target="_blank" rel="noreferrer">📸 Instagram</a></li>
          <li><a href="https://wa.me/34667774648" target="_blank" rel="noreferrer">🇪🇸 WhatsApp ES</a></li>
          <li><a href="https://wa.me/351927418705" target="_blank" rel="noreferrer">🇵🇹 WhatsApp PT</a></li>
        </ul>
      </div>
    </div>
    <div className="ft-bot">
      <span>© {new Date().getFullYear()} Agustín Servicios Generales · {t.foot.r}</span>
      <span>🇪🇸 Málaga · Costa del Sol &nbsp;|&nbsp; 🇵🇹 Algarve</span>
    </div>
  </footer>

  {/* ── WA FLOAT ── */}
  <a className="waf" href="https://wa.me/34667774648" target="_blank" rel="noreferrer" aria-label="WhatsApp">💬</a>

  {/* ── MODAL ── */}
  <div className={`movl${modal?' on':''}`} onClick={e=>{if(e.target===e.currentTarget)sModal('');}}>
    <div className="modal">
      <button className="mcl" onClick={()=>sModal('')}>✕</button>
      {modal==='login'&&<>
        <div className="mtit">{t.gal.loginTit}</div>
        <p className="msub">{t.gal.loginSub}</p>
        <div className="fg">
          <label className="flbl">{t.gal.loginLbl}</label>
          <input className="fin" type="password" placeholder={t.gal.loginPh} value={pw}
            onChange={e=>{sPw(e.target.value);sPwErr(false);}}
            onKeyDown={e=>e.key==='Enter'&&doLogin()} autoFocus/>
          {pwErr&&<div className="ferr">⚠ {t.gal.loginErr}</div>}
        </div>
        <button className="mok" onClick={doLogin}>{t.gal.loginBtn}</button>
      </>}
      {modal==='up'&&<>
        <div className="mtit">{t.gal.upTit}</div>
        <p className="msub">{t.gal.upSub}</p>
        <div className={`uzn${drag?' drag':''}`}
          onClick={()=>fref.current.click()}
          onDragOver={e=>{e.preventDefault();sDrag(true);}}
          onDragLeave={()=>sDrag(false)}
          onDrop={onDrop}>
          <div className="uzn-ico">📸</div>
          <div className="uzn-t">{t.gal.uzn}</div>
          <div className="uzn-h">{t.gal.uznh}</div>
        </div>
        <input ref={fref} type="file" accept="image/*" multiple style={{display:'none'}} onChange={e=>addFiles(e.target.files)}/>
        {files.length>0&&<div className="pst">{files.map((f,i)=><img key={i} className="pth" src={URL.createObjectURL(f)} alt="p"/>)}</div>}
        <div className="fg"><label className="flbl">{t.gal.fTit}</label><input className="fin" type="text" placeholder={t.gal.phTit} value={utit} onChange={e=>sUtit(e.target.value)}/></div>
        <div className="fg"><label className="flbl">{t.gal.fDesc}</label><textarea className="fin" placeholder={t.gal.phDesc} value={udesc} onChange={e=>sUdesc(e.target.value)}/></div>
        <div className="fg"><label className="flbl">{t.gal.fDate}</label><input className="fin" type="date" value={udate} onChange={e=>sUdate(e.target.value)}/></div>
        <button className="mok" onClick={doPublish} disabled={busy||!files.length||!utit}>{busy?t.gal.subbing:t.gal.sub}</button>
      </>}
    </div>
  </div>

  <div className={`toast${toast?' on':''}`}>{toast}</div>
  </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
